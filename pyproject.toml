[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qndm-ecg"
version = "0.1.0"
description = "QNDM-enhanced variational quantum ECG classification experiments on MIT-BIH."
requires-python = ">=3.11"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"

